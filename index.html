<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ticTacToe.com</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- sounds -->
     <audio src="music.mp3" id="gameSound"></audio>
     <audio src="ting.mp3" id="clickSound"></audio>
     <audio src="gameWin.mp3" id="gameWinSound"></audio>
     <audio src="gameOver.mp3" id="gameOverSound"></audio>

    <nav class="navBar">
      <div class="title">Tic Tac Toe</div>
    </nav>

    <div class="container">
      <div class="boxes pop">
        <div class="line lineShadow"></div>

        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
      </div>

      <div class="gameInfo pop">
        <div class="info">
          <p class="turn"></p>
          <p id="gameResp"></p>
          <img src="excited.gif" alt="win" class="dance hide" />
          <img src="music.png" alt="music" class="music" />
        </div>

        <button id="newGame" class="hide">New Game</button>
        <button id="resetGame" class="">Reset Game</button>
        <button id="themeBtn">🌙</button>
      </div>
    </div>
    <footer>
      <div class="copyRight">&copy; By Ind games</div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
